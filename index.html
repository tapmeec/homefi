<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homeFi | Link in Bio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0d1527; /* Fondo general azul oscuro */
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Gran tarjeta blanca central */
        .main-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 36px;
            padding: 45px 24px 30px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Perfil / Header con Círculo de Logo grande */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 12px;
            padding: 12px;
            border: 2px solid #eaeaea;
            position: relative;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        /* Insignia de verificación verde opcional */
        .verified-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background-color: #22c55e;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            border: 2px solid white;
        }

        p.bio {
            font-size: 0.85rem;
            color: #64748b;
            max-width: 320px;
            line-height: 1.4;
            margin-top: 5px;
        }

        /* Contenedor de Enlaces */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .bio-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 14px 18px;
            border-radius: 18px;
            text-decoration: none;
            color: #1a1a1a;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .bio-link:hover {
            transform: translateY(-2px);
            border-color: #0098da;
            box-shadow: 0 6px 16px rgba(0, 152, 218, 0.12);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .link-text h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 2px;
        }

        .link-text span {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .link-arrow {
            font-size: 0.8rem;
            color: #cbd5e1;
        }

        /* Footer dentro de la tarjeta blanca */
        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
        }

        footer span {
            font-weight: 600;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- Perfil / Logo -->
        <div class="profile-card">
            <div class="logo-container">
                <!-- Vinculado directamente al archivo logohomefi.png en tu repositorio -->
                <img src="logohomefi.png" alt="homeFi Logo">
                <div class="verified-badge">
                    <i class="fa-solid fa-check"></i>
                </div>
            </div>
            <p class="bio">Tecnología inteligente para transformar cada espacio de tu hogar en una experiencia única.</p>
        </div>

        <!-- Enlaces -->
        <div class="links-container">
            <!-- Página Web -->
            <a href="https://homefi.com.ec/" target="_blank" class="bio-link">
                <div class="link-left">
                    <div class="link-icon-box" style="color: #0098da;">
                        <i class="fa-solid fa-globe"></i>
                    </div>
                    <div class="link-text">
                        <h3>Tienda Online Oficial</h3>
                        <span>homefi.com.ec</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <!-- WhatsApp -->
            <a href="https://wa.me/593967788686?text=Hola%20homeFi.%20Necesito%20más%20información%20sobre%20sus%20productos." target="_blank" class="bio-link">
                <div class="link-left">
                    <div class="link-icon-box" style="color: #25D366;">
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    <div class="link-text">
                        <h3>Atención por WhatsApp</h3>
                        <span>+593 96 778 6868</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <!-- Instagram -->
            <a href="https://instagram.com" target="_blank" class="bio-link">
                <div class="link-left">
                    <div class="link-icon-box" style="color: #E1306C;">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <div class="link-text">
                        <h3>Síguenos en Instagram</h3>
                        <span>@homefi.ec</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>

            <!-- Reseña de Google -->
            <a href="https://g.page/r/tu-enlace-de-google-business" target="_blank" class="bio-link">
                <div class="link-left">
                    <div class="link-icon-box" style="color: #FBBC05;">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <div class="link-text">
                        <h3>Califícanos en Google</h3>
                        <span>Déjanos tu reseña 5 estrellas</span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right link-arrow"></i>
            </a>
        </div>

        <!-- Footer -->
        <footer>
            <p>Powered by <span>homeFi Ecuador</span></p>
        </footer>
    </div>

</body>
</html>
