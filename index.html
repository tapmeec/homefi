    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0d1527; /* Fondo general azul oscuro */
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Gran tarjeta blanca central */
        .main-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 36px;
            padding: 50px 28px 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Perfil / Header con Círculo de Logo más grande y expandido */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 28px;
            width: 100%;
        }

        .logo-container {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            margin-bottom: 16px;
            padding: 10px;
            border: 2px solid #eaeaea;
            position: relative;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        /* Insignia de verificación verde */
        .verified-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background-color: #22c55e;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            border: 3px solid white;
        }

        p.bio {
            font-size: 0.9rem;
            color: #64748b;
            max-width: 360px;
            line-height: 1.4;
            margin-top: 8px;
        }

        /* Contenedor de Enlaces */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .bio-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 15px 18px;
            border-radius: 18px;
            text-decoration: none;
            color: #1a1a1a;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .bio-link:hover {
            transform: translateY(-2px);
            border-color: #0098da;
            box-shadow: 0 6px 16px rgba(0, 152, 218, 0.12);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-icon-box {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .link-text h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 2px;
        }

        .link-text span {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .link-arrow {
            font-size: 0.8rem;
            color: #cbd5e1;
        }

        /* Footer con el logo de Tap Me interactivo */
        footer {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .tapme-logo-link {
            display: inline-block;
            transition: transform 0.2s ease;
            /* Si necesitas que destaque mejor sobre el fondo blanco del pie, puedes descomentar la siguiente línea de fondo oscuro opcional: */
            /* background-color: #0d1527; padding: 6px 12px; border-radius: 8px; */
        }

        .tapme-logo-link:hover {
            transform: scale(1.08);
        }

        .tapme-logo-link img {
            height: 24px; /* Tamaño optimizado para el footer */
            width: auto;
            object-fit: contain;
        }
    </style>
</head>
