<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homeFi | Enlaces</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Perfil / Header */
        .profile-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #eaeaea;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111111;
            margin-bottom: 6px;
        }

        p.bio {
            font-size: 0.9rem;
            color: #666666;
            max-width: 320px;
            line-height: 1.4;
        }

        /* Contenedor de Enlaces */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .bio-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ffffff;
            border: 1px solid #e5e5e5;
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: #1a1a1a;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .bio-link:hover {
            transform: translateY(-2px);
            border-color: #111111;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            background-color: #111111;
            color: #ffffff;
        }

        .bio-link:hover .link-icon-right {
            color: #ffffff;
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-content i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        /* Efectos especiales en hover por botón */
        .bio-link.whatsapp:hover {
            background-color: #25D366;
            border-color: #25D366;
        }

        .link-icon-right {
            font-size: 0.85rem;
            color: #aaa;
            transition: color 0.25s ease;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #888888;
            text-align: center;
        }

        footer a {
            color: #111;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Perfil -->
        <div class="profile-card">
            <div class="logo-container">
                <img src="https://homefi.com.ec/wp-content/uploads/2024/06/Recurso-2-fotor-2024062814430-100x100.png" alt="homeFi Logo">
            </div>
            <h1>homeFi</h1>
            <p class="bio">Tecnología y domótica para transformar cada espacio de tu hogar en una experiencia inteligente.</p>
        </div>

        <!-- Enlaces -->
        <div class="links-container">
            <!-- Página Web -->
            <a href="https://homefi.com.ec/" target="_blank" class="bio-link">
                <div class="link-content">
                    <i class="fa-solid fa-globe" style="color: #111;"></i>
                    <span>Visita nuestra Tienda Online</span>
                </div>
                <i class="fa-solid fa-chevron-right link-icon-right"></i>
            </a>
